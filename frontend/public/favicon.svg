<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="28" y1="20" x2="72" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="55" y1="58" x2="55" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="100" height="100" rx="28" fill="url(#bgGrad)" />

  <!-- Leaf Silhouette -->
  <path d="M 32 80 C 26 58, 38 32, 68 18 C 76 28, 80 48, 70 70 C 62 82, 46 86, 32 80 Z" fill="url(#leafGrad)" />

  <!-- Veins -->
  <path d="M 28 84 C 36 68, 48 48, 68 20" stroke="#15803D" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 44 56 C 54 50, 64 48, 70 46" stroke="#15803D" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 52 42 C 60 38, 68 34, 72 32" stroke="#15803D" stroke-width="2.5" stroke-linecap="round" />

  <!-- Irrigation Droplet -->
  <path d="M 54 58 C 54 58, 46 70, 46 76 C 46 81, 50 85, 55 85 C 60 85, 64 81, 64 76 C 64 70, 54 58, 54 58 Z" fill="url(#dropGrad)" stroke="#0284C7" stroke-width="1.5" />
  <path d="M 51 72 C 49 74, 49 78, 51 80" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
</svg>
